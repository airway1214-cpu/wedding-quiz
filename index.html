<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>婚禮賓客動物圖鑑｜測測看你是哪種喜宴小動物？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-paper: #FAF7F2;
      --card-bg: #FFFFFF;
      --border-soft: #E6DFD3;
      --text-main: #4A4238;
      --text-sub: #7D7366;
      --sage-green: #7A9A82;
      --sage-light: #EEF3EF;
      --apricot: #E89B72;
      --apricot-light: #FDF3ED;
      --cream-yellow: #F4D58D;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      background-color: var(--bg-paper);
      background-image: radial-gradient(#E3DCD0 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-soft);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(74, 66, 56, 0.06);
      padding: 28px 22px;
      position: relative;
      overflow: hidden;
    }

    /* 日系紙膠帶裝飾 */
    .washi-tape {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(-1.5deg);
      width: 110px;
      height: 24px;
      background: rgba(122, 154, 130, 0.28);
      border-left: 2px dashed rgba(255,255,255,0.6);
      border-right: 2px dashed rgba(255,255,255,0.6);
    }

    .screen {
      display: none;
      animation: fadeIn 0.45s ease forwards;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 首頁樣式 */
    .badge-tag {
      display: inline-block;
      background: var(--sage-light);
      color: var(--sage-green);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 99px;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    h1.main-title {
      font-size: 24px;
      line-height: 1.4;
      margin: 0 0 12px;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-sub);
      margin: 0 0 22px;
    }

    .hero-illustration {
      background: #FCF9F4;
      border: 1.5px dashed var(--border-soft);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 22px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .nickname-input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border-soft);
      border-radius: 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-main);
      background: #FFFDF9;
      outline: none;
      transition: border-color 0.2s;
    }

    .nickname-input:focus {
      border-color: var(--sage-green);
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: var(--sage-green);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(122, 154, 130, 0.3);
      transition: transform 0.15s, background 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      width: 100%;
      padding: 13px;
      border: 1.5px solid var(--border-soft);
      border-radius: 14px;
      background: #FFFFFF;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 10px;
    }

    /* 測驗進度條 */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--sage-green);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #EFECE6;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-fill {
      height: 100%;
      background: var(--sage-green);
      border-radius: 99px;
      width: 12.5%;
      transition: width 0.35s ease;
    }

    .question-tag {
      font-size: 12px;
      color: var(--apricot);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .question-text {
      font-size: 18px;
      line-height: 1.5;
      font-weight: 700;
      margin: 0 0 20px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      background: #FFFDF9;
      border: 1.5px solid var(--border-soft);
      border-radius: 15px;
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.18s ease;
    }

    .option-btn:hover {
      border-color: var(--sage-green);
      background: var(--sage-light);
    }

    .option-btn:active {
      transform: scale(0.985);
    }

    .option-letter {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #EFECE6;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .option-btn:hover .option-letter {
      background: var(--sage-green);
      color: #FFFFFF;
    }

    /* Loading 畫面 */
    .loading-box {
      padding: 50px 10px;
      text-align: center;
    }

    .spinner-leaf {
      font-size: 42px;
      display: inline-block;
      animation: bounce 1s infinite alternate ease-in-out;
      margin-bottom: 14px;
    }

    @keyframes bounce {
      from { transform: translateY(0) rotate(-6deg); }
      to { transform: translateY(-10px) rotate(6deg); }
    }

    /* 結果圖卡區域（供 html2canvas 截圖） */
    .result-capture-area {
      background: #FAF7F2;
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      padding: 22px 18px;
      text-align: center;
      margin-bottom: 16px;
    }

    .result-for {
      font-size: 12.5px;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .result-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 14px;
    }

    .animal-svg-box {
      width: 150px;
      height: 150px;
      margin: 0 auto 14px;
      background: #FFFFFF;
      border-radius: 50%;
      border: 1.5px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(74, 66, 56, 0.05);
    }

    .hashtags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }

    .hashtag {
      background: #FFFFFF;
      border: 1px solid var(--border-soft);
      color: var(--sage-green);
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .result-desc {
      background: #FFFFFF;
      border-radius: 14px;
      padding: 14px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text-main);
      text-align: left;
      border: 1px solid #EFECE6;
      margin-bottom: 12px;
    }

    .partner-box {
      background: var(--apricot-light);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .partner-label {
      color: var(--apricot);
      font-weight: 700;
    }

    .card-footer-note {
      margin-top: 12px;
      font-size: 11px;
      color: #A3988A;
      letter-spacing: 0.04em;
    }

    .hint-text {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="washi-tape"></div>

  <!-- 1. 首頁 -->
  <div id="screen-start" class="screen active" style="text-align: center;">
    <span class="badge-tag">WEDDING GUEST QUIZ</span>
    <h1 class="main-title">婚禮賓客動物圖鑑<br>你是哪種喜宴小動物？</h1>
    <p class="subtitle">
      進場先看背板還是點心？主持人喊玩遊戲會躲起來嗎？<br>
      8 個婚禮小情境，測出你的隱藏賓客屬性！
    </p>

    <div class="hero-illustration">
      <!-- 首頁組合插畫 SVG -->
      <svg width="210" height="95" viewBox="0 0 210 95" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 裝飾小花與愛心 -->
        <circle cx="35" cy="25" r="4" fill="#F4D58D"/>
        <circle cx="175" cy="22" r="5" fill="#E89B72" fill-opacity="0.6"/>
        <path d="M105 14C105 14 101 9 97 12C93 15 98 21 105 25C112 21 117 15 113 12C109 9 105 14 105 14Z" fill="#E89B72"/>

        <ellipse cx="62" cy="64" rx="24" ry="18" fill="#D5B895" stroke="#4A4238" stroke-width="2"/>
        <circle cx="48" cy="48" r="5" fill="#D5B895" stroke="#4A4238" stroke-width="2"/>
        <circle cx="53" cy="60" r="2" fill="#4A4238"/>

        <circle cx="62" cy="44" r="6" fill="#F29F3D" stroke="#4A4238" stroke-width="1.8"/>
        <path d="M62 38L64 35" stroke="#7A9A82" stroke-width="2" stroke-linecap="round"/>

        <ellipse cx="148" cy="62" rx="20" ry="21" fill="#E6DFD3" stroke="#4A4238" stroke-width="2"/>
        <circle cx="141" cy="57" r="6" fill="#FFFFFF" stroke="#4A4238" stroke-width="1.8"/>
        <circle cx="155" cy="57" r="6" fill="#FFFFFF" stroke="#4A4238" stroke-width="1.8"/>
        <circle cx="141" cy="57" r="2" fill="#4A4238"/>
        <circle cx="155" cy="57" r="2" fill="#4A4238"/>
        <path d="M146 62L148 66L150 62Z" fill="#E89B72" stroke="#4A4238" stroke-width="1.5"/>
        <!-- 地面草線 -->
        <path d="M22 84H188" stroke="#7A9A82" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
      </svg>
      <div style="font-size: 12px; color: #7D7366; margin-top: 4px;">水豚・狐獴・紅鶴・黃金獵犬・無尾熊・貓頭鷹</div>
    </div>

    <div class="input-group">
      <label for="nickname">你的暱稱</label>
      <input type="text" id="nickname" class="nickname-input" placeholder="例如：愛吃甜點的小美、大學死黨阿哲" maxlength="16" />
    </div>

    <button class="btn-primary" onclick="startQuiz()">開始測驗（共 8 題）</button>
  </div>

  <!-- 2. 測驗頁 -->
  <div id="screen-quiz" class="screen">
    <div class="progress-header">
      <span id="progress-label">第 1 / 8 題</span>
      <span id="progress-percent">13%</span>
    </div>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <div id="question-tag" class="question-tag">Q1｜踏進會場的第一秒</div>
    <h2 id="question-text" class="question-text">題目載入中...</h2>
    <div id="options-list" class="options-list"></div>
  </div>

  <!-- 3. 計算過場 -->
  <div id="screen-loading" class="screen">
    <div class="loading-box">
      <div class="spinner-leaf">🌿</div>
      <h3 style="margin: 0 0 8px; font-size: 18px;">正在翻閱婚禮動物圖鑑...</h3>
      <p style="margin: 0; font-size: 13.5px; color: var(--text-sub);">分析你的喜宴雷達與賓客靈魂中</p>
    </div>
  </div>

  <!-- 4. 結果頁 -->
  <div id="screen-result" class="screen">
    <div id="capture-area" class="result-capture-area">
      <div id="result-for" class="result-for">給 賓客 的婚禮動物鑑定書</div>
      <h2 id="result-title" class="result-title">美食鑑賞家・水豚</h2>
      <div id="animal-svg-box" class="animal-svg-box"></div>
      <div id="result-hashtags" class="hashtags"></div>
      <div id="result-desc" class="result-desc"></div>
      <div class="partner-box">
        <span class="partner-label">婚禮最佳同桌拍檔</span>
        <span id="result-partner" style="font-weight: 700;">感性暖心派・無尾熊</span>
      </div>
      <div class="card-footer-note">✦ 婚禮賓客動物圖鑑・快傳到群組找你的拍檔 ✦</div>
    </div>

    <button class="btn-primary" onclick="downloadResultCard()">儲存專屬結果圖卡（分享限動）</button>
    <button class="btn-secondary" onclick="resetQuiz()">再測一次</button>
    <p id="save-status" class="hint-text">你的測驗結果已悄悄傳送給新人參考囉 💌</p>
  </div>
</div>

  // 狀態變數
  let currentQuestionIndex = 0;
  let userNickname = "";
  let scores = { FOOD: 0, GAME: 0, GIFT: 0, SOCIAL: 0, VIBE: 0, CHILL: 0 };
  let userAnswers = [];

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function startQuiz() {
    userNickname = document.getElementById('nickname').value.trim() || "神秘賓客";
    currentQuestionIndex = 0;
    scores = { FOOD: 0, GAME: 0, GIFT: 0, SOCIAL: 0, VIBE: 0, CHILL: 0 };
    userAnswers = [];
    renderQuestion();
    showScreen('screen-quiz');
  }

  function renderQuestion() {
    const q = QUESTIONS[currentQuestionIndex];
    const total = QUESTIONS.length;
    const percent = Math.round(((currentQuestionIndex + 1) / total) * 100);

    document.getElementById('progress-label').textContent = `第 ${currentQuestionIndex + 1} / ${total} 題`;
    document.getElementById('progress-percent').textContent = `${percent}%`;
    document.getElementById('progress-fill').style.width = `${percent}%`;
    document.getElementById('question-tag').textContent = q.tag;
    document.getElementById('question-text').textContent = q.text;

    const optionsContainer = document.getElementById('options-list');
    optionsContainer.innerHTML = "";

    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<span class="option-letter">${opt.label}</span><span>${opt.text}</span>`;
      btn.onclick = () => handleSelectOption(opt);
      optionsContainer.appendChild(btn);
    });
  }

  function handleSelectOption(option) {
    // 累加維度分數
    for (const [key, val] of Object.entries(option.weights)) {
      scores[key] += val;
    }
    userAnswers.push(`Q${currentQuestionIndex + 1}:${option.label}(${option.text})`);

    if (currentQuestionIndex < QUESTIONS.length - 1) {
      currentQuestionIndex++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz() {
    showScreen('screen-loading');

    // 計算各維度得分率，找出最高者（若同分則隨機抽一隻，避免順序偏誤）
    let bestRatio = -1;
    let candidates = [];

    for (const [dim, val] of Object.entries(scores)) {
      const ratio = val / MAX_POSSIBLE[dim];
      if (ratio > bestRatio + 0.0001) {
        bestRatio = ratio;
        candidates = [dim];
      } else if (Math.abs(ratio - bestRatio) <= 0.0001) {
        candidates.push(dim);
      }
    }

    const topDimension = candidates[Math.floor(Math.random() * candidates.length)];
    const resultAnimal = ANIMALS[topDimension];

    // 填入結果頁內容
    document.getElementById('result-for').textContent = `給 ${userNickname} 的婚禮賓客鑑定書`;
    document.getElementById('result-title').textContent = resultAnimal.name;
    document.getElementById('animal-svg-box').innerHTML = resultAnimal.svg;
    document.getElementById('result-desc').textContent = resultAnimal.desc;
    document.getElementById('result-partner').textContent = resultAnimal.partner;

    const tagsEl = document.getElementById('result-hashtags');
    tagsEl.innerHTML = resultAnimal.hashtags.map(t => `<span class="hashtag">${t}</span>`).join('');

    // 背景傳送資料至 Google Sheets
    sendDataToGoogleSheets(resultAnimal.name);

    setTimeout(() => {
      showScreen('screen-result');
    }, 1400);
  }

  function sendDataToGoogleSheets(animalName) {
    if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
      document.getElementById('save-status').textContent = "（預覽模式：尚未綁定試算表網址，目前僅供測試顯示）";
      return;
    }

    const payload = {
      nickname: userNickname,
      animalName: animalName,
      scores: scores,
      answers: userAnswers
    };

    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(err => console.error("傳送失敗:", err));
  }

  function downloadResultCard() {
    const captureEl = document.getElementById('capture-area');
    html2canvas(captureEl, {
      scale: 2,
      backgroundColor: "#FAF7F2",
      borderRadius: 20
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = `婚禮賓客動物鑑定_${userNickname}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  }

  function resetQuiz() {
    showScreen('screen-start');
  }
